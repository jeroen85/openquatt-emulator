name: Virtual HIL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openquatt_ref:
        description: OpenQuatt-commit, branch of refs/pull/<nummer>/merge
        type: string
        required: false
      architecture:
        description: Architectuur voor de Q Duo-rooktest
        type: choice
        default: x64
        options: [x64, arm64]
      profile:
        description: Aanvullende firmwareproeven
        type: choice
        default: basis
        options: [basis, herstart, modbus, energie, regeling, alles]
      baseline_ref:
        description: Optionele OpenQuatt-ref voor de geheugenvergelijking
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: virtual-hil-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  emulator-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test the runner and scenarios
        run: |
          python -B -m unittest \
            scripts.native_spi.test_tooling \
            scripts.native_spi.test_pr_memory \
            scripts.native_spi.test_scenarios \
            scripts.native_spi.test_power_house \
            scripts.native_spi.test_extended_scenarios \
            scripts.native_spi.test_safety_scenarios \
            scripts.native_spi.test_runtime_scenarios scripts.native_spi.test_cosim \
            scripts.native_spi.test_pr_suite
      - name: Test the native models
        shell: bash
        run: |
          flags=(-std=c++17 -Wall -Wextra -Werror)
          c++ "${flags[@]}" scripts/native_spi/test_model.cpp -o "$RUNNER_TEMP/test_model"
          "$RUNNER_TEMP/test_model"
          c++ "${flags[@]}" scripts/native_spi/test_scenarios.cpp \
            scripts/native_spi/native/odu_bridge.cpp -o "$RUNNER_TEMP/test_scenarios"
          "$RUNNER_TEMP/test_scenarios"

  q-duo-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-q-duo
        with:
          ref: ${{ inputs.openquatt_ref || 'b215a3511ab7c05d9a0bad782b894420a98cbcef' }}
          role: candidate

  q-duo-baseline:
    if: ${{ inputs.baseline_ref != '' }}
    needs: q-duo-firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-q-duo
        with:
          ref: ${{ inputs.baseline_ref }}
          role: baseline

  q-duo-hil:
    needs: [emulator-checks, q-duo-firmware, q-duo-baseline]
    if: >-
      ${{ !cancelled() && needs.emulator-checks.result == 'success' && needs.q-duo-firmware.result == 'success' &&
          (needs.q-duo-baseline.result == 'success' || needs.q-duo-baseline.result == 'skipped') }}
    runs-on: ${{ (inputs.profile == 'modbus' || inputs.profile == 'energie' || inputs.profile == 'regeling' || inputs.profile == 'alles') && 'macos-15' || inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: q-duo-candidate
          path: ${{ runner.temp }}/q-duo-candidate
      - uses: actions/download-artifact@v7
        if: ${{ inputs.baseline_ref != '' }}
        with:
          name: q-duo-baseline
          path: ${{ runner.temp }}/q-duo-baseline
      - name: Install the pinned Linux runtime
        if: runner.os == 'Linux'
        run: |
          command -v lsof >/dev/null || sudo apt-get install -y lsof
          python -B -m scripts.native_spi.cosim_build
      - name: Install the pinned macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          test "$(uname -m)" = arm64
          brew install pkgconf libslirp
          asset=esp-emu-0.51.0-aarch64-apple-darwin
          curl --fail --location --retry 3 --max-time 90 \
            "https://github.com/espressif/esp-emulator/releases/download/v0.51.0/$asset.tar.gz" \
            -o "$RUNNER_TEMP/$asset.tar.gz"
          printf 'ab02524bd286ce84577639731d0e48d623ce9be65e45d9e1246dd220c1476102  %s\n' \
            "$RUNNER_TEMP/$asset.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$asset.tar.gz" -C "$RUNNER_TEMP" "$asset/esp-emu"
          mkdir -p .tmp/native-spi/runtime
          install -m 755 "$RUNNER_TEMP/$asset/esp-emu" .tmp/native-spi/runtime/esp-emu.original
      - name: Run selected Q Duo firmware tests
        shell: bash
        env:
          PROFILE: ${{ inputs.profile || 'basis' }}
        run: |
          backend=cosim
          if [[ "$RUNNER_OS" == macOS ]]; then backend=native; fi
          output="$RUNNER_TEMP/virtual-hil-report"
          mkdir -p "$output"
          candidate="$RUNNER_TEMP/q-duo-candidate"
          (
            cd "$candidate"
            shasum -a 256 -c firmware.sha256
          )
          cp "$candidate/source.json" "$output/source-candidate.json"
          cp "$candidate/firmware.sha256" "$output/firmware-candidate.sha256"
          baseline_args=()
          baseline="$RUNNER_TEMP/q-duo-baseline"
          if [[ -d "$baseline" ]]; then
            (
              cd "$baseline"
              shasum -a 256 -c firmware.sha256
            )
            cp "$baseline/source.json" "$output/source-baseline.json"
            cp "$baseline/firmware.sha256" "$output/firmware-baseline.sha256"
            test "$(jq -r '.esphome' "$candidate/source.json")" = "$(jq -r '.esphome' "$baseline/source.json")" ||
              { echo "De ESPHome-versies van baseline en kandidaat verschillen."; exit 1; }
            baseline_args=(--baseline-firmware "$baseline/firmware.factory.bin")
          fi
          python -B -m scripts.native_spi.pr_suite --profile "$PROFILE" --backend "$backend" \
            --firmware "$candidate/firmware.factory.bin" --output "$output" "${baseline_args[@]}"
      - name: Publish the suite summary
        if: always()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/virtual-hil-report/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: virtual-hil-report-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/virtual-hil-report/
          if-no-files-found: warn
          retention-days: 14
