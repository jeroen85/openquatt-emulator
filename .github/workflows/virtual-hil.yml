name: Virtual HIL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openquatt_ref:
        description: OpenQuatt-commit, branch of refs/pull/<nummer>/merge
        type: string
        required: false
      architecture:
        description: Architectuur voor de Q Duo-rooktest
        type: choice
        default: x64
        options: [x64, arm64]

permissions:
  contents: read

concurrency:
  group: virtual-hil-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  emulator-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test the runner and scenarios
        run: |
          python -B -m unittest \
            scripts.native_spi.test_tooling \
            scripts.native_spi.test_pr_memory \
            scripts.native_spi.test_scenarios \
            scripts.native_spi.test_power_house \
            scripts.native_spi.test_extended_scenarios \
            scripts.native_spi.test_safety_scenarios \
            scripts.native_spi.test_runtime_scenarios scripts.native_spi.test_cosim
      - name: Test the native models
        shell: bash
        run: |
          flags=(-std=c++17 -Wall -Wextra -Werror)
          c++ "${flags[@]}" scripts/native_spi/test_model.cpp -o "$RUNNER_TEMP/test_model"
          "$RUNNER_TEMP/test_model"
          c++ "${flags[@]}" scripts/native_spi/test_scenarios.cpp \
            scripts/native_spi/native/odu_bridge.cpp -o "$RUNNER_TEMP/test_scenarios"
          "$RUNNER_TEMP/test_scenarios"

  q-duo-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          repository: OpenQuatt/OpenQuatt
          ref: ${{ inputs.openquatt_ref || '82a840099548ccbef958bbd5fa95a68beba24d90' }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-esphome.txt
      - name: Build the OpenQuatt web app
        run: |
          npm ci --ignore-scripts
          npm run build:web
      - name: Build the unmodified Q Duo factory image
        shell: bash
        run: |
          python -m pip install -r .github/requirements-esphome.txt
          source_revision="$(git rev-parse HEAD)"
          target=configs/heatpump_controller_q/duo.yaml
          export ESPHOME_DEFAULT_COMPILE_PROCESS_LIMIT=2
          esphome -s build_source_repository OpenQuatt/OpenQuatt \
            -s build_source_commit "$source_revision" -s build_target "$target" compile "$target"
          build_dir=.esphome/build/heatpump_controller_q_duo/build
          python scripts/repair_factory_bin.py "$build_dir" --normalize-app
          bundle="$RUNNER_TEMP/q-duo"
          mkdir -p "$bundle"
          cp "$build_dir/firmware.factory.bin" "$bundle/"
          (
            cd "$bundle"
            sha256sum firmware.factory.bin > firmware.sha256
          )
          jq -n --arg revision "$source_revision" --arg target "$target" \
            --arg esphome "$(esphome version)" \
            '{repository:"OpenQuatt/OpenQuatt",revision:$revision,target:$target,esphome:$esphome}' \
            > "$bundle/source.json"
      - uses: actions/upload-artifact@v6
        with:
          name: q-duo-factory
          path: ${{ runner.temp }}/q-duo/
          if-no-files-found: error
          retention-days: 1

  q-duo-smoke:
    needs: [emulator-checks, q-duo-firmware]
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: q-duo-factory
          path: ${{ runner.temp }}/q-duo
      - name: Install the pinned Espressif co-simulation runtime
        run: |
          command -v lsof >/dev/null || sudo apt-get install -y lsof
          python -B -m scripts.native_spi.cosim_build
      - name: Boot Q Duo and check Wi-Fi, web, PT1000 and both outside units
        shell: bash
        run: |
          (
            cd "$RUNNER_TEMP/q-duo"
            sha256sum -c firmware.sha256
          )
          mkdir -p "$RUNNER_TEMP/virtual-hil-report"
          cp "$RUNNER_TEMP/q-duo/"{source.json,firmware.sha256} "$RUNNER_TEMP/virtual-hil-report/"
          python -B -m scripts.native_spi.run --backend cosim --firmware "$RUNNER_TEMP/q-duo/firmware.factory.bin" \
            --network wifi --scenario compatibility --seconds 150 --name github-q-duo \
            | tee "$RUNNER_TEMP/virtual-hil-report/runner.log"
      - name: Collect the report
        if: always()
        shell: bash
        run: |
          output="$RUNNER_TEMP/virtual-hil-report"
          shopt -s nullglob
          for run in .tmp/native-spi/runs/github-q-duo-*; do
            for name in report.json live.json serial.log; do
              if [[ -f "$run/$name" ]]; then
                cp "$run/$name" "$output/"
              fi
            done
          done
          if [[ -f "$output/report.json" ]]; then
            outcome="$(jq -r 'if .status == "PASS_COSIM" then "Q Duo-rooktest geslaagd" else .status end' "$output/report.json")"
            printf '### Q Duo · virtuele HIL\n\nUitkomst: **%s**\n\n' "$outcome" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.failure_reasons[] | "- " + .' "$output/report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: virtual-hil-report-${{ runner.arch }}
          path: ${{ runner.temp }}/virtual-hil-report/
          if-no-files-found: warn
          retention-days: 14
