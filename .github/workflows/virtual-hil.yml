name: Virtual HIL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openquatt_ref:
        description: OpenQuatt-commit, branch of refs/pull/<nummer>/merge
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: virtual-hil-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  emulator-checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test the runner and scenarios
        run: |
          python -B -m unittest \
            scripts.native_spi.test_tooling \
            scripts.native_spi.test_pr_memory \
            scripts.native_spi.test_scenarios \
            scripts.native_spi.test_power_house \
            scripts.native_spi.test_extended_scenarios \
            scripts.native_spi.test_safety_scenarios \
            scripts.native_spi.test_runtime_scenarios
      - name: Test the native models
        shell: bash
        run: |
          sdk_flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            sdk="$(xcrun --sdk macosx --show-sdk-path)"
            sdk_flags=(-isysroot "$sdk" -isystem "$sdk/usr/include/c++/v1")
          fi
          flags=(-std=c++17 -Wall -Wextra -Werror)
          c++ "${sdk_flags[@]}" "${flags[@]}" scripts/native_spi/test_model.cpp -o "$RUNNER_TEMP/test_model"
          "$RUNNER_TEMP/test_model"
          c++ "${sdk_flags[@]}" "${flags[@]}" scripts/native_spi/test_scenarios.cpp \
            scripts/native_spi/native/odu_bridge.cpp -o "$RUNNER_TEMP/test_scenarios"
          "$RUNNER_TEMP/test_scenarios"

  q-duo-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          repository: OpenQuatt/OpenQuatt
          ref: ${{ inputs.openquatt_ref || '82a840099548ccbef958bbd5fa95a68beba24d90' }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-esphome.txt
      - name: Build the OpenQuatt web app
        run: |
          npm ci --ignore-scripts
          npm run build:web
      - name: Build the unmodified Q Duo factory image
        shell: bash
        run: |
          python -m pip install -r .github/requirements-esphome.txt
          source_revision="$(git rev-parse HEAD)"
          target=configs/heatpump_controller_q/duo.yaml
          export ESPHOME_DEFAULT_COMPILE_PROCESS_LIMIT=2
          esphome -s build_source_repository OpenQuatt/OpenQuatt \
            -s build_source_commit "$source_revision" -s build_target "$target" compile "$target"
          build_dir=.esphome/build/heatpump_controller_q_duo/build
          python scripts/repair_factory_bin.py "$build_dir" --normalize-app
          bundle="$RUNNER_TEMP/q-duo"
          mkdir -p "$bundle"
          cp "$build_dir/firmware.factory.bin" "$bundle/"
          (
            cd "$bundle"
            sha256sum firmware.factory.bin > firmware.sha256
          )
          jq -n --arg revision "$source_revision" --arg target "$target" \
            --arg esphome "$(esphome version)" \
            '{repository:"OpenQuatt/OpenQuatt",revision:$revision,target:$target,esphome:$esphome}' \
            > "$bundle/source.json"
      - uses: actions/upload-artifact@v6
        with:
          name: q-duo-factory
          path: ${{ runner.temp }}/q-duo/
          if-no-files-found: error
          retention-days: 1

  q-duo-smoke:
    needs: [emulator-checks, q-duo-firmware]
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: q-duo-factory
          path: ${{ runner.temp }}/q-duo
      - name: Install the pinned macOS emulator
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          test "$(uname -m)" = arm64
          brew install pkgconf libslirp
          asset=esp-emu-0.51.0-aarch64-apple-darwin
          curl --fail --location --retry 3 --max-time 90 \
            "https://github.com/espressif/esp-emulator/releases/download/v0.51.0/$asset.tar.gz" \
            -o "$RUNNER_TEMP/$asset.tar.gz"
          printf 'ab02524bd286ce84577639731d0e48d623ce9be65e45d9e1246dd220c1476102  %s\n' \
            "$RUNNER_TEMP/$asset.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$asset.tar.gz" -C "$RUNNER_TEMP" "$asset/esp-emu"
          mkdir -p .tmp/native-spi/runtime
          install -m 755 "$RUNNER_TEMP/$asset/esp-emu" .tmp/native-spi/runtime/esp-emu.original
      - name: Boot Q Duo and check Wi-Fi, web, PT1000 and both outside units
        shell: bash
        run: |
          (
            cd "$RUNNER_TEMP/q-duo"
            shasum -a 256 -c firmware.sha256
          )
          mkdir -p "$RUNNER_TEMP/virtual-hil-report"
          cp "$RUNNER_TEMP/q-duo/"{source.json,firmware.sha256} "$RUNNER_TEMP/virtual-hil-report/"
          python -B -m scripts.native_spi.run --firmware "$RUNNER_TEMP/q-duo/firmware.factory.bin" \
            --network wifi --scenario compatibility --seconds 150 --name github-q-duo \
            | tee "$RUNNER_TEMP/virtual-hil-report/runner.log"
      - name: Collect the report
        if: always()
        shell: bash
        run: |
          output="$RUNNER_TEMP/virtual-hil-report"
          shopt -s nullglob
          for run in .tmp/native-spi/runs/github-q-duo-*; do
            for name in report.json live.json serial.log; do
              if [[ -f "$run/$name" ]]; then
                cp "$run/$name" "$output/"
              fi
            done
          done
          if [[ -f "$output/report.json" ]]; then
            printf '### Q Duo · virtuele HIL\n\nUitkomst: **%s**\n\n' \
              "$(jq -r '.status' "$output/report.json")" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.failure_reasons[] | "- " + .' "$output/report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: virtual-hil-report
          path: ${{ runner.temp }}/virtual-hil-report/
          if-no-files-found: warn
          retention-days: 14
