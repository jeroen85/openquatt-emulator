name: Virtual HIL
run-name: ${{ github.event.action == 'labeled' && !contains(fromJSON('["hil:basis","hil:herstart","hil:netwerk","hil:https","hil:regeling","hil:stooklijn","hil:regeling-kern","hil:uitgebreid"]'), github.event.label.name) && 'Virtuele HIL · Geen proef aangevraagd' || 'Virtual HIL' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openquatt_ref:
        description: OpenQuatt-commit, branch of refs/pull/<nummer>/merge
        type: string
        required: false
      architecture:
        description: Architectuur voor de Ubuntu-proeven
        type: choice
        default: x64
        options: [x64, arm64]
      profile:
        description: Aanvullende firmwareproeven
        type: choice
        default: basis
        options: [basis, herstart, netwerk, https, regeling, stooklijn, regeling-kern, uitgebreid]
      profiles:
        description: Meerdere profielen, kommagescheiden. Overschrijft profile.
        type: string
        required: false
      baseline_ref:
        description: Optionele OpenQuatt-ref voor de geheugenvergelijking
        type: string
        required: false

  workflow_call:
    inputs:
      openquatt_ref:
        type: string
        required: false
      architecture:
        type: string
        default: x64
      profile:
        type: string
        default: basis
      profiles:
        type: string
        required: false
      baseline_ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: virtual-hil-${{ github.ref }}-${{ inputs.profiles || inputs.profile || 'basis' }}-${{ inputs.openquatt_ref }}-${{ inputs.baseline_ref }}-${{ inputs.architecture || 'x64' }}-${{ github.event.action == 'labeled' && !contains(fromJSON('["hil:basis","hil:herstart","hil:netwerk","hil:https","hil:regeling","hil:stooklijn","hil:regeling-kern","hil:uitgebreid"]'), github.event.label.name) && github.run_id || 'tests' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    if: ${{ github.event.action != 'labeled' || contains(fromJSON('["hil:basis","hil:herstart","hil:netwerk","hil:https","hil:regeling","hil:stooklijn","hil:regeling-kern","hil:uitgebreid"]'), github.event.label.name) }}
    name: Proeven en firmwareversies kiezen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.selection.outputs.profiles }}
      runner: ${{ steps.selection.outputs.runner }}
      label: ${{ steps.selection.outputs.label }}
      lab: ${{ steps.selection.outputs.lab }}
      timeout_minutes: ${{ steps.selection.outputs.timeout_minutes }}
      candidate: ${{ steps.selection.outputs.candidate }}
      baseline: ${{ steps.selection.outputs.baseline }}
      artifact_key: ${{ steps.selection.outputs.artifact_key }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve the requested OpenQuatt source
        id: source
        run: python3 -B -m scripts.native_spi.pr_plan --source-ref
      - uses: actions/checkout@v6
        with:
          repository: OpenQuatt/OpenQuatt
          ref: ${{ inputs.openquatt_ref || steps.source.outputs.ref }}
          path: plan-candidate
          persist-credentials: false
      - uses: actions/checkout@v6
        if: ${{ inputs.baseline_ref != '' || steps.source.outputs.baseline != '' }}
        with:
          repository: OpenQuatt/OpenQuatt
          ref: ${{ inputs.baseline_ref || steps.source.outputs.baseline }}
          path: plan-baseline
          persist-credentials: false
      - name: Resolve revisions and select profiles
        id: selection
        shell: bash
        env:
          PROFILES: ${{ inputs.profiles || inputs.profile }}
          ARCHITECTURE: ${{ inputs.architecture || 'x64' }}
        run: |
          export CANDIDATE_SHA="$(git -C plan-candidate rev-parse HEAD)"
          BASELINE_SHA=""
          if [[ -d plan-baseline ]]; then
            BASELINE_SHA="$(git -C plan-baseline rev-parse HEAD)"
          fi
          export BASELINE_SHA
          python3 -B -m scripts.native_spi.pr_plan

  emulator-checks:
    if: ${{ github.event.action != 'labeled' || contains(fromJSON('["hil:basis","hil:herstart","hil:netwerk","hil:https","hil:regeling","hil:stooklijn","hil:regeling-kern","hil:uitgebreid"]'), github.event.label.name) }}
    name: Emulator controleren
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test the runner and scenarios
        run: |
          python -B -m unittest discover -s scripts/native_spi -t . -p 'test_*.py'
      - name: Test the native models
        shell: bash
        run: |
          flags=(-std=c++17 -Wall -Wextra -Werror)
          c++ "${flags[@]}" scripts/native_spi/test_model.cpp -o "$RUNNER_TEMP/test_model"
          "$RUNNER_TEMP/test_model"
          c++ "${flags[@]}" scripts/native_spi/test_scenarios.cpp \
            scripts/native_spi/native/odu_bridge.cpp -o "$RUNNER_TEMP/test_scenarios"
          "$RUNNER_TEMP/test_scenarios"

  q-duo-hil:
    name: Q Duo · ${{ needs.plan.outputs.label }}
    needs: [plan, emulator-checks]
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes || '30') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: sudo apt-get install -y lsof pkg-config libslirp-dev libglib2.0-dev iproute2
      - name: Build the shared candidate images
        id: firmware
        uses: ./.github/actions/build-q-duo
        with:
          ref: ${{ needs.plan.outputs.candidate }}
          role: candidate
          lab: ${{ needs.plan.outputs.lab }}
      - name: Build a different baseline only when required
        id: baseline
        if: ${{ needs.plan.outputs.baseline != '' && needs.plan.outputs.baseline != needs.plan.outputs.candidate }}
        uses: ./.github/actions/build-q-duo
        with:
          ref: ${{ needs.plan.outputs.baseline }}
          role: baseline
      - name: Install the pinned Linux runtime
        run: python -B -m scripts.native_spi.cosim_build
      - name: Run the selected tests once, sequentially
        shell: bash
        env:
          PROFILES: ${{ needs.plan.outputs.profiles }}
          CANDIDATE_SHA: ${{ needs.plan.outputs.candidate }}
          BASELINE_SHA: ${{ needs.plan.outputs.baseline }}
          CANDIDATE_DIR: ${{ steps.firmware.outputs.firmware_directory }}
          BASELINE_DIR: ${{ steps.baseline.outputs.firmware_directory }}
          LAB_DIR: ${{ steps.firmware.outputs.lab_directory }}
          HTTPS_FIXTURE: ${{ steps.firmware.outputs.https_fixture }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/virtual-hil-report"
          mkdir -p "$output"
          verify_firmware() {
            local folder="$1" revision="$2" role="$3"
            (
              cd "$folder"
              test "$(jq -er '.revision' source.json)" = "$revision"
              sha256sum -c firmware.sha256
            )
            cp "$folder/source.json" "$output/source-$role.json"
            cp "$folder/firmware.sha256" "$output/firmware-$role.sha256"
          }
          verify_firmware "$CANDIDATE_DIR" "$CANDIDATE_SHA" candidate
          args=()
          if [[ -n "$BASELINE_SHA" ]]; then
            baseline="$CANDIDATE_DIR"
            if [[ "$BASELINE_SHA" != "$CANDIDATE_SHA" ]]; then baseline="$BASELINE_DIR"; fi
            verify_firmware "$baseline" "$BASELINE_SHA" baseline
            test "$(jq -r '.esphome' "$CANDIDATE_DIR/source.json")" = "$(jq -r '.esphome' "$baseline/source.json")"
            args+=(--baseline-firmware "$baseline/firmware.factory.bin")
          fi
          if [[ -n "$LAB_DIR" ]]; then
            verify_firmware "$LAB_DIR" "$CANDIDATE_SHA" lab
            test "$(jq -r '.test_only' "$LAB_DIR/source.json")" = true
            test "$(jq -r '.profile' "$LAB_DIR/source.json")" = local_https_test_ca
            args+=(--lab-firmware "$LAB_DIR/firmware.factory.bin" --https-fixture "$HTTPS_FIXTURE")
          fi
          sudo unshare --net bash -c 'ip link set dev lo up && exec "$@"' _ \
            /usr/bin/python3 -B -m scripts.native_spi.pr_suite --profile "$PROFILES" --backend cosim \
            --firmware "$CANDIDATE_DIR/firmware.factory.bin" --output "$output" "${args[@]}"
      - name: Publish the suite summary
        if: always()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/virtual-hil-report/summary.md"
          if [[ -f "$summary" ]]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: virtual-hil-report-${{ needs.plan.outputs.artifact_key }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/virtual-hil-report/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: virtual-hil-pr-result-${{ needs.plan.outputs.artifact_key }}-suite-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/virtual-hil-report/pr-result.json
            ${{ runner.temp }}/virtual-hil-report/source-candidate.json
          if-no-files-found: ignore
          retention-days: 2
