# Test-only diagnostics. This package is deliberately excluded from releases.
# Every baseline/candidate pair must use the same instrumentation profile.
# Trace adds per-task bookkeeping; uxTaskGetSystemState scans stacks under the
# kernel lock. snapshot_us exposes that probe cost; this is not a release profile.
substitutions:
  oq_lab_diagnostics_interval: 1s

esphome:
  includes:
    - ../../scripts/simulator/firmware/lab_diagnostics.h
  build_flags:
    - -DOQ_LAB_DIAGNOSTICS_TARGET=1

# A separate component owns early setup. Do not merge diagnostics into the
# production on_boot action list: that list contains asynchronous delays.
external_components:
  - source:
      type: local
      path: ../../scripts/simulator/firmware
    components: [diagnostics_component]

diagnostics_component:

esp32:
  framework:
    sdkconfig_options:
      CONFIG_FREERTOS_USE_TRACE_FACILITY: y

interval:
  - interval: ${oq_lab_diagnostics_interval}
    then:
      - lambda: |-
          oq_lab_diagnostics::emit();

button:
  - platform: template
    name: Lab Capture Diagnostics
    entity_category: diagnostic
    on_press:
      - lambda: |-
          oq_lab_diagnostics::emit();
